name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: command -v jq || { if [ "$RUNNER_OS" = macOS ]; then brew install jq; else sudo apt-get install -y jq; fi; }

      - name: Test (default bash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/test.sh

      - name: Test (macOS bash 3.2)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /bin/bash tests/test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck skills/emsk-pr/scan.sh skills/emsk-pr/guard.sh tests/test.sh
